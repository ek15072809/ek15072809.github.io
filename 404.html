<script>
  // 旧URLを新URLへ転送
  //   /news-en.html → /en/news.html,  /news.html → /jp/news.html
  (function () {
    var m = location.pathname.match(/^\/([a-z]+)(-en)?\.html$/);
    if (!m || (m[1] === 'index' && !m[2])) return;
    var dir = m[2] ? '/en/' : '/jp/';
    var page = (m[1] === 'index') ? '' : m[1] + '.html';
    location.replace(dir + page + location.search + location.hash);
  })();
</script>
